name: keep-alive

# The free Render host sleeps ~15 min after its last HTTP request, and while it sleeps
# every page that needs a service fails. Ping it every 10 minutes during demo hours only:
# 04:00-15:59 UTC (09:30-21:29 IST), ~12h/day, to stay inside the 750 free hours shared with
# brandcast-tv. Scheduled workflows only run from the default branch.
on:
  schedule:
    - cron: "*/10 4-15 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping services health
        run: curl -fsS --retry 3 --retry-delay 15 --max-time 120 https://foodos-services.onrender.com/health
